name: testing

on:
  push:
    branches:
      - updated-version
    paths-ignore:
      - '**/*.md'
      - '**.md'
  pull_request:
    branches:
      - updated-version
    paths-ignore:
      - '**/*.md'
      - '**.md'

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_CACHE: 'gradle'

  ANDROID_PROFILE: Nexus 6
  ANDROID_TARGET: google_apis
  ANDROID_API_LEVEL: 31
  ANDROID_ARCH: x86_64

jobs:
  unit_test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.GRADLE_CACHE }}

      - name: Inject MAPS_API_KEY into secrets.properties
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> secrets.properties

      - name: Inject TEST_TOKEN into local.properties
        run: echo "TEST_TOKEN=${{ secrets.TEST_TOKEN }}" >> local.properties

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/

  instrumentation_test:
    name: Instrumentation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      actions: write # Needed for cache and artifact upload
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Inject MAPS_API_KEY into secrets.properties
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> secrets.properties

      - name: Inject TEST_TOKEN into local.properties
        run: echo "TEST_TOKEN=${{ secrets.TEST_TOKEN }}" >> local.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.GRADLE_CACHE }}

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: ${{ env.ANDROID_ARCH }}
          force-avd-creation: false
          profile: ${{ env.ANDROID_PROFILE }}
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -dns-server 8.8.8.8 -netfast -no-metrics -camera-back none
          script: |
            adb wait-for-device
            # Wait for full boot and a working outbound TCP. `sys.boot_completed=1` fires
            # before the Wi-Fi stack comes up, and `ip route get 8.8.8.8` reports
            # success while the kernel's per-network fwmark route is still missing. Probe
            # an actual TCP connect to 8.8.8.8:53 instead - it exercises the same path
            # the test sockets will use.
            adb shell 'i=0; while [ -z "$(getprop sys.boot_completed | tr -d "\r")" ]; do i=$((i+1)); if [ $i -gt 300 ]; then exit 1; fi; sleep 2; done'
            adb shell 'i=0; while ! nc -w 2 8.8.8.8 53 </dev/null >/dev/null 2>&1; do i=$((i+1)); if [ $i -gt 30 ]; then exit 1; fi; sleep 2; done'
            # Disable IPv6: the emulator has site-local + link-local v6 but no global v6
            # route, so connect() to a global v6 address hangs instead of returning ENETUNREACH.
            adb root && adb wait-for-device
            adb shell sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
            adb shell sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
            adb shell sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true
            adb shell ip addr

            echo "--- TCP connect test to resolved IP ---"
            adb shell "nc -z -v -w 5 75.2.21.170 443 && echo TCP_OK || echo TCP_FAILED"
            echo "--- TCP connect test via hostname ---"
            adb shell "nc -z -v -w 5 story-api.dicoding.dev 443 && echo TCP_OK_HOSTNAME || echo TCP_FAILED_HOSTNAME"
            ./gradlew connectedCheck
            
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Run instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          force-avd-creation: false
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          disable-animations: true
          script: |
            adb wait-for-device
            ./gradlew connectedDebugAndroidTest --no-parallel --stacktrace && killall -INT crashpad_handler || true